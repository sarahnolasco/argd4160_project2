<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Poster</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Interactive Poster</h1>

    <main>

        <!-- THE POSTER -->
        <div class="poster" id="poster">

            <div class="shape"></div>

            <h2 id="posterText">hello</h2>

            <img
                id="posterImage"
                src="dog.jpeg"
                alt="Dog"
            >

        </div>


        <!-- CONTROLS -->
        <div class="controls">

            <h2>Controls</h2>

            <label>Text</label>
            <input
                type="text"
                id="textInput"
                value="hello"
            >

            <label>Background Color</label>
            <input
                type="color"
                id="backgroundColor"
                value="#dda7ca"
            >

            <label>Text Color</label>
            <input
                type="color"
                id="textColor"
                value="#ffffff"
            >

            <label>Text X Position</label>
            <input
                type="range"
                id="textX"
                min="-200"
                max="200"
                value="0"
            >

            <label>Text Y Position</label>
            <input
                type="range"
                id="textY"
                min="-200"
                max="200"
                value="0"
            >

            <label>Image X Position</label>
            <input
                type="range"
                id="xPosition"
                min="-200"
                max="200"
                value="0"
            >

            <label>Image Y Position</label>
            <input
                type="range"
                id="yPosition"
                min="-250"
                max="250"
                value="0"
            >

            <label>Rotate</label>
            <input
                type="range"
                id="rotation"
                min="-180"
                max="180"
                value="0"
            >

            <label>Skew X</label>
            <input
                type="range"
                id="skewX"
                min="-45"
                max="45"
                value="0"
            >

            <label>Skew Y</label>
            <input
                type="range"
                id="skewY"
                min="-45"
                max="45"
                value="0"
            >

            <label>Scale</label>
            <input
                type="range"
                id="scale"
                min="0.5"
                max="2"
                step="0.01"
                value="1"
            >
            <hr>

            <h3>Shape Controls</h3>

            <label>Shape X Position</label>
            <input
                type="range"
                id="shapeX"
                min="-300"
                max="300"
                value="0"
            >


            <label>Shape Y Position</label>
            <input
                type="range"
                id="shapeY"
                min="-300"
                max="300"
                value="0"
            >


            <label>Shape Rotation</label>
            <input
                type="range"
                id="shapeRotation"
                min="-180"
                max="180"
                value="0"
            >


            <label>Shape Scale</label>
            <input
                type="range"
                id="shapeScale"
                min="0.5"
                max="2"
                step="0.01"
                value="1"
            >


            <label>Shape Color</label>
            <input
                type="color"
                id="shapeColor"
                value="#f5c86c"
            >

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
